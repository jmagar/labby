[package]
name = "labby-runtime"
description = "Internal Lab runtime contracts and surface-neutral helpers shared by the gateway-extraction crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["homelab", "mcp", "gateway", "runtime"]
categories = ["development-tools"]
publish = false

[dependencies]
labby-primitives = { path = "../labby-primitives" }
url.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
thiserror.workspace = true
jiff.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true
reqwest.workspace = true
futures.workspace = true
# Skills extension (SEP-2640): sha2 verifies `sha256:` resource digests;
# serde_yaml_ng parses `SKILL.md` frontmatter for the field-by-field comparison
# the SEP requires against a skill entry's `frontmatter`. Both stay
# transport-neutral, so neither weakens this crate's no-rmcp/axum/clap rule.
sha2.workspace = true
unicode-normalization.workspace = true
serde_yaml_ng.workspace = true
atomic-write-file = "0.3.1"
base64.workspace = true

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["macros"] }

[lints]
workspace = true

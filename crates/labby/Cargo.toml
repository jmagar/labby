[package]
name = "labby"
default-run = "labby"
description = "Rust MCP gateway with Code Mode, authentication, protected routes, setup, logs, CLI, HTTP API, and operator web UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["mcp", "gateway", "homelab", "labby", "agents"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "labby"
path = "src/main.rs"
test = false

[[bin]]
name = "stdio-mcp-fixture"
path = "tests/fixtures/stdio_mcp_fixture.rs"
test = false
required-features = ["proxy-testkit"]

[[bin]]
name = "live-harness-fixture"
path = "tests/fixtures/live_harness_fixture.rs"
test = false

[dependencies]
labby-apis = { path = "../labby-apis" }
labby-auth = { path = "../labby-auth", features = ["http-axum", "upstream-oauth-rmcp"] }
labby-browser = { path = "../labby-browser" }
labby-primitives = { path = "../labby-primitives" }
labby-runtime = { path = "../labby-runtime" }
labby-codemode = { path = "../labby-codemode", optional = true }
labby-gateway = { path = "../labby-gateway", optional = true }
labby-openapi = { path = "../labby-openapi", optional = true }
labby-web = { path = "../labby-web", optional = true }

tokio = { workspace = true, features = ["process"] }
process-wrap = { version = "9.1.0", default-features = false, features = [
  "tokio1",
  "process-group",
] }
nix = { version = "0.31", default-features = false, features = [
  "signal",
  "process",
  "user",
  "fs",
] }
futures.workspace = true
reqwest.workspace = true
# Direct dep (not just transitive via reqwest) so entrypoint.rs can install
# the process-wide ring crypto provider at startup. See the root Cargo.toml
# comment on `reqwest`/`rustls` for why.
rustls.workspace = true
url.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
percent-encoding.workspace = true
serde_yaml_ng.workspace = true
anyhow.workspace = true
thiserror.workspace = true
jiff.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"

clap.workspace = true
clap_complete.workspace = true
dialoguer.workspace = true

dotenvy.workspace = true
toml.workspace = true
dirs = "5"


base64.workspace = true
fd-lock = "4"
tempfile = "3.27"
subtle = "2"
sha2 = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
hmac.workspace = true
chacha20poly1305 = "0.10"
dashmap = "6"
diffy-imara = "0.3"
arc-swap = "1"
tokio-util = { version = "0.7", features = ["rt", "compat", "codec"] }
strip-ansi-escapes = "0.2"

hex = "0.4"
getrandom = "0.4"
ulid = "1"

rmcp.workspace = true
# Transport-layer body-cap wrapper (dispatch/upstream/http_client.rs) uses
# bytes::Bytes and sse-stream::SseStream directly. `http` types come in via
# reqwest::header (already a direct dep).
bytes = "1"
sse-stream = "0.2"
rusqlite.workspace = true
uuid.workspace = true

axum.workspace = true
http-body-util.workspace = true
hyper = { version = "1.9", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = ["http1", "http2", "native-tokio", "ring", "tls12"] }
tower.workspace = true
tower-http.workspace = true
utoipa = { workspace = true, optional = true }

oauth2 = { version = "5.0", default-features = false }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

# optional — fs feature (workspace filesystem browser)
walkdir = { version = "2", optional = true }
globset = { version = "0.4", optional = true }
unicode-normalization = { workspace = true }
unicode-casefold = { workspace = true }
rustix = { version = "1", features = ["fs", "process"] }
toml_edit = "0.23"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"

[target.'cfg(unix)'.dependencies]
sd-notify = { version = "0.5", optional = true }

[target.'cfg(windows)'.dependencies]
# Windows Job Object process-tree reaping. The raw `windows-sys` FFI lives in
# `labby-winjob` (the sanctioned unsafe crate), so `lab` stays unsafe-free and
# keeps the workspace `unsafe_code = "forbid"` lint. This mirrors how the Unix
# path routes its unsafe through the external `nix` crate.
labby-winjob = { path = "../labby-winjob" }

[dev-dependencies]
jsonschema = { version = "0.37.4", default-features = false }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
labby-auth = { path = "../labby-auth", features = ["http-axum", "upstream-oauth-rmcp"] }
wiremock.workspace = true
proptest = "1"
tracing-core = "0.1"
# Cross-slice test support inventories fixture trees even when the product `fs`
# surface is absent. Keep that test-only dependency available without pulling
# filesystem browser behavior into the integrated artifact.
walkdir = "2"

[target.'cfg(unix)'.dev-dependencies]
# Observe exited cleanup leaders without releasing their PID/group identity.
rustix = { version = "1", features = ["fs", "process"] }

[lib]
path = "src/lib.rs"

# Feature-slice contract:
# - `default` is the standalone production gateway host package.
# - `integrated-gateway` is the sealed headless Core sidecar slice. It keeps
#   Code Mode, remote HTTP/OAuth upstreams, and the management API while
#   excluding standalone web assets and optional host-management surfaces.
# - `all` means all remaining supported Labby host features, not retired product surfaces.
# - Product slices must compile with `--no-default-features --features <slice> --all-targets`.
# - Retired product surfaces (ACP, deploy, fleet/nodes, marketplace, stash) are intentionally
#   deleted from this crate rather than left as sleeping feature gates.
# - Helper/internal features are not standalone product slices unless this comment is updated.
[features]
all = ["lab-admin", "api-docs", "gateway-host", "fs", "systemd", "skills"]
gateway = [
  "dep:labby-codemode",
  "dep:labby-gateway",
  "dep:labby-openapi",
  "web-ui",
  # The gateway and its embedded operator UI expose Skills as a core surface;
  # every gateway-shaped build must therefore compile the implementation too.
  "skills",
]
gateway-host = ["gateway"]
integrated-gateway = ["gateway"]
web-ui = ["dep:labby-web"]
api-docs = ["dep:utoipa"]
# Agent Skills flow through `gateway`, so both plain production builds and
# explicit gateway feature slices cannot ship a disabled Skills surface.
default = ["gateway-host"]
fs = ["dep:walkdir", "dep:globset"]
lab-admin = []
# Agent Skills over MCP (SEP-2640). `labby-gateway?/skills` is a WEAK dependency
# feature: it enables skills support in labby-gateway only when that optional
# crate is already in the build, so a serve-only `--features skills` build does
# not silently drag the whole gateway in.
skills = ["labby-gateway?/skills"]
systemd = ["dep:sd-notify"]
proxy-testkit = ["labby-gateway/testkit"]
[lints]
workspace = true

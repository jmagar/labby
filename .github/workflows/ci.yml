name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # This pull_request-capable workflow never references shared credentials.
  # Protected cache writers belong in a main-only environment whose deployment
  # policy is enforced by GitHub, outside branch-controlled workflow content.
  KACHE_S3_ACCESS_KEY: ""
  KACHE_S3_SECRET_KEY: ""
  KACHE_S3_ENDPOINT: ${{ vars.KACHE_S3_ENDPOINT }}
  KACHE_S3_BUCKET: ${{ vars.KACHE_S3_BUCKET }}
  KACHE_S3_PREFIX: ""
  # External prerequisite: the object-store policy must restrict these
  # credentials to this prefix. Cache stays credentialless until an admin
  # records that server-enforced capability in the repository variable.
  KACHE_S3_PREFIX_ENFORCED: ${{ vars.KACHE_S3_PREFIX_ENFORCED }}

jobs:
  fleet-policy:
    name: Fleet workflow policy / policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Enforce hosted workflow policy
        run: >-
          python scripts/ci/check_workflow_policy.py
          --release-file-regex '(^|/)(release|build-incus-image)\.ya?ml$'
          --allow-arm64
      - name: Verify workflow policy tests and Node toolchain sync
        run: |
          python -m unittest scripts/ci/test_workflow_policy.py scripts/ci/test_ci_supply_policy.py
          python scripts/ci/check_node_toolchain_sync.py
      - name: Enforce shared-cache capability boundary
        run: >-
          python scripts/ci/check-cache-boundary.py
          --event '${{ github.event_name }}'
          --ref '${{ github.ref }}'
          --run-id '${{ github.run_id }}'

  # The repository contract runs once, from repository-contract.yml (the
  # required "Repository Contract" gate). Keep it separate from the policy
  # check above so each required status has one clear owner.

  changes:
    name: changes
    runs-on: ubuntu-24.04
    # Every executable CI job depends on this classifier. Fork pull requests
    # are untrusted, so fail closed before any fork-controlled checkout or
    # script can reach the homelab runner fleet.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 10
    outputs:
      # `all` and `docs` are exported for the run summary only — no job gates
      # on them. Every other key below is read by an `if:` somewhere in this
      # file, and the classify step fails the build if a gate has no matching
      # entry here.
      all: ${{ steps.classify.outputs.all }}
      docs: ${{ steps.classify.outputs.docs }}
      docs_check: ${{ steps.classify.outputs.docs_check }}
      workflow: ${{ steps.classify.outputs.workflow }}
      rust_compile: ${{ steps.classify.outputs.rust_compile }}
      rust_test: ${{ steps.classify.outputs.rust_test }}
      web: ${{ steps.classify.outputs.web }}
      browser_extension: ${{ steps.classify.outputs.browser_extension }}
      palette: ${{ steps.classify.outputs.palette }}
      unraid: ${{ steps.classify.outputs.unraid }}
      npm: ${{ steps.classify.outputs.npm }}
      docker: ${{ steps.classify.outputs.docker }}
      security: ${{ steps.classify.outputs.security }}
      javascript_advisories: ${{ steps.classify.outputs.javascript_advisories }}
      release: ${{ steps.classify.outputs.release }}
      # Comma-separated routing keys this workflow gates on that the trusted
      # base-branch classifier could not emit. The classify step already forced
      # them to `true`; this output only reports the drift to `ci-gate`.
      gate_key_drift: ${{ steps.classify.outputs.gate_key_drift }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare trusted changed path classifier
        run: |
          set -euo pipefail
          classifier="scripts/ci/changed_paths.py"
          trusted="/tmp/lab-changed-paths.py"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if ! git show "${{ github.event.pull_request.base.sha }}:$classifier" > "$trusted" 2>/dev/null; then
              # The base commit predates the classifier entirely. Emit no keys:
              # the reconciliation in the next step forces every key ci.yml
              # gates on to `true`, so this still fails closed to running
              # everything without keeping a second copy of the key list here.
              cat > "$trusted" <<'PY'
          #!/usr/bin/env python3
          import argparse
          from pathlib import Path
          parser = argparse.ArgumentParser()
          parser.add_argument("--event", required=True)
          parser.add_argument("--output", type=Path, required=True)
          parser.add_argument("--write-changed-files", type=Path)
          args, _ = parser.parse_known_args()
          if args.write_changed_files:
              args.write_changed_files.write_text("")
          args.output.write_text("")
          PY
            fi
          else
            cp "$classifier" "$trusted"
          fi
          chmod +x "$trusted"
          echo "LABBY_CHANGED_PATHS=$trusted" >> "$GITHUB_ENV"
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 "$LABBY_CHANGED_PATHS" \
            --event "$EVENT_NAME" \
            --output classifier-outputs.txt \
            --write-changed-files changed-files.txt
          # The classifier is trusted (base commit) but ci.yml is the merge ref,
          # so a pull request that adds a routing key gates on a key the base
          # classifier cannot emit. An unknown output is the empty string, and
          # `'' == 'true'` is false — the gated job would skip silently and
          # still satisfy ci-gate. Missing keys therefore fail OPEN: the job
          # runs, and the drift is reported instead of hidden.
          #
          # Both key sets are derived from ci.yml so they cannot drift from the
          # gates they describe. `needs.changes.outputs.<key>` is what other
          # jobs gate on; `steps.classify.outputs.<key>` is what this job
          # forwards as a job output. A gate with no matching forward always
          # reads as the empty string no matter what the classifier emits, so
          # that is an authoring bug and fails the build instead of failing
          # open. Enumeration failing at all is fatal too: a silent no-op here
          # would reinstate the very bug this reconciliation exists to close.
          workflow_keys() {
            grep -v '^[[:space:]]*#' .github/workflows/ci.yml \
              | grep -oE "$1\.[A-Za-z_][A-Za-z0-9_]*" \
              | sed "s/^$1\.//" \
              | sort -u
          }
          [ -r .github/workflows/ci.yml ] \
            || { echo "::error::cannot read .github/workflows/ci.yml; refusing to route"; exit 1; }
          gated_keys="$(workflow_keys 'needs\.changes\.outputs' | grep -vx gate_key_drift || true)"
          forwarded_keys="$(workflow_keys 'steps\.classify\.outputs' || true)"
          # Flatten to space-delimited strings and match with bash pattern
          # tests from here on. Nothing below forks: a `grep` that fails to
          # spawn under load returns non-zero, which membership checks would
          # read as "absent" — a tool failure silently reinterpreted as a
          # policy violation, which is the exact bug class this step exists
          # to prevent.
          gated_flat=" $(printf '%s' "$gated_keys" | tr '\n' ' ') "
          forwarded_flat=" $(printf '%s' "$forwarded_keys" | tr '\n' ' ') "
          # `rust_test` gates most of the workspace, so its absence from either
          # set means enumeration broke rather than that the gate went away.
          [[ "$gated_flat" == *" rust_test "* ]] \
            || { echo "::error::cannot enumerate ci.yml gate references (no 'rust_test'); refusing to route"; exit 1; }
          [[ "$forwarded_flat" == *" rust_test "* ]] \
            || { echo "::error::cannot enumerate the changes job outputs (no 'rust_test'); refusing to route"; exit 1; }
          # The trusted classifier is arbitrary base-branch code; do not assume
          # its output file ends in a newline before reading or appending.
          if [ -s classifier-outputs.txt ] && [ -n "$(tail -c1 classifier-outputs.txt)" ]; then
            printf '\n' >> classifier-outputs.txt
          fi
          # Being pinned to the base commit also makes the trusted classifier
          # lag on path -> category MAPPINGS, not just on key names: a pull
          # request that routes a new directory into an existing category gets a
          # well-formed `false` for it, and the gated job skips for real. So
          # re-run the branch's own classifier over the SAME trusted file list
          # and take the union. It can only raise a `false` to `true`: a value
          # it lowers, a key it invents, and the changed-file list itself are
          # all ignored. A branch can therefore broaden its own CI, never
          # narrow it.
          broadened=""
          if [ "$EVENT_NAME" = pull_request ] && [ -f scripts/ci/changed_paths.py ]; then
            if python3 scripts/ci/changed_paths.py \
                --event "$EVENT_NAME" \
                --changed-files changed-files.txt \
                --output branch-outputs.txt > /dev/null; then
              branch_true=" $(sed -n 's/=true$//p' branch-outputs.txt | tr '\n' ' ') "
              : > merged-outputs.txt
              while IFS='=' read -r key value; do
                if [ "$value" = false ] && [[ "$branch_true" == *" $key "* ]]; then
                  value=true
                  broadened="${broadened:+$broadened,}$key"
                fi
                printf '%s=%s\n' "$key" "$value" >> merged-outputs.txt
              done < classifier-outputs.txt
              mv merged-outputs.txt classifier-outputs.txt
              if [ -n "$broadened" ]; then
                echo "::notice title=Changed-path routing broadened::the branch classifier routes more work than the base commit's: ${broadened}. Those jobs run."
              fi
            else
              echo "::warning title=Changed-path routing::the branch's own classifier failed to run; routing falls back to the base commit's classifier alone, which may not know this branch's new path mappings."
            fi
          fi
          classified="$(cat classifier-outputs.txt)"
          drift=""
          while read -r key; do
            [ -n "$key" ] || continue
            if [[ "$forwarded_flat" != *" $key "* ]]; then
              echo "::error::ci.yml gates on needs.changes.outputs.$key but the changes job never forwards steps.classify.outputs.$key; that gate reads as an empty string and would silently skip the job (forwarded:${forwarded_flat})"
              exit 1
            fi
            # Presence is not enough: a malformed value ('True', '1', '') also
            # fails the `== 'true'` comparison and skips the job.
            case $'\n'"$classified"$'\n' in
              *$'\n'"$key=true"$'\n'*|*$'\n'"$key=false"$'\n'*) continue ;;
            esac
            drift="${drift:+$drift,}$key"
            echo "::warning title=Changed-path routing drift::the trusted classifier did not emit a usable '$key'; defaulting it to true so the gated job runs."
          done <<< "$gated_keys"
          if [ -n "$drift" ]; then
            # One rewrite: drop every reconciled key's malformed line, then
            # re-add it as true.
            drift_flat=" ${drift//,/ } "
            : > reconciled-outputs.txt
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              [[ "$drift_flat" == *" ${line%%=*} "* ]] || printf '%s\n' "$line" >> reconciled-outputs.txt
            done <<< "$classified"
            for key in ${drift//,/ }; do
              printf '%s=true\n' "$key" >> reconciled-outputs.txt
            done
            mv reconciled-outputs.txt classifier-outputs.txt
          fi
          printf 'gate_key_drift=%s\n' "$drift" >> classifier-outputs.txt
          cat classifier-outputs.txt >> "$GITHUB_OUTPUT"
          {
            echo '### Changed-path routing'
            echo '```'
            cat classifier-outputs.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce retired feature boundary
        run: scripts/check-retired-features.sh

  unraid-plugin-check:
    name: Unraid plugin checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: ${{ needs.changes.outputs.unraid == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.3"
          coverage: none
      - run: scripts/ci/unraid-plugin-checksums.sh
      - run: scripts/ci/unraid-runtime-tests.sh

  actionlint:
    name: Actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: ${{ needs.changes.outputs.workflow == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.5
      - name: Run pinned Actionlint
        run: |
          set -euo pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          go version
          echo "actionlint=v1.7.7"
      - name: Test CI policy helpers
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
          python3 -m unittest scripts/ci/test_check_rust_coverage.py scripts/ci/test_windows_ci_policy.py scripts/ci/test_protected_doc_guard.py scripts/ci/test_release_hardening.py scripts/ci/test_multi_user_migration_rehearsal.py

  lifecycle-static-analysis:
    name: Lifecycle script static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: ${{ needs.changes.outputs.workflow == 'true' || needs.changes.outputs.release == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Analyze every shipped shell lifecycle script
        run: scripts/ci/check-lifecycle-scripts.sh
      - name: Install pinned PowerShell validation modules
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
      - name: Analyze every shipped PowerShell lifecycle script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $inventory = Get-Content scripts/ci/lifecycle-scripts.json -Raw | ConvertFrom-Json
          $results = @($inventory.powershell | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Severity Warning,Error })
          $results | Format-Table -AutoSize
          if ($results.Count -ne 0) { throw "PSScriptAnalyzer found $($results.Count) issue(s)" }

  windows-installer:
    name: Windows installer behavioral contracts
    runs-on: windows-latest
    timeout-minutes: 15
    needs: changes
    if: ${{ needs.changes.outputs.workflow == 'true' || needs.changes.outputs.release == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Install pinned Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
      - name: Run installer contracts on Windows
        shell: pwsh
        run: Invoke-Pester scripts/tests/install.ps1.Tests.ps1 -Output Detailed

  macos-installer:
    name: macOS installer behavioral contracts
    runs-on: macos-15
    timeout-minutes: 15
    needs: changes
    if: ${{ needs.changes.outputs.workflow == 'true' || needs.changes.outputs.release == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Run installer contracts on macOS
        run: scripts/tests/installers.sh

  frontend-assets:
    name: Frontend assets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.rust_compile == 'true' ||
        needs.changes.outputs.docs_check == 'true' ||
        needs.changes.outputs.web == 'true' ||
        needs.changes.outputs.docker == 'true' ||
        needs.changes.outputs.release == 'true'
      }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-gateway-admin
      - name: Upload gateway-admin export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gateway-admin-out
          path: apps/gateway-admin/out/
          if-no-files-found: error
          retention-days: 1

  gateway-admin-browser:
    name: Gateway Admin browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Keep the browser install and test on the standard hosted-runner path.
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    defaults:
      run:
        working-directory: apps/gateway-admin
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 9.15.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/gateway-admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright runtime libraries
        run: |
          set -euo pipefail
          # Hosted Ubuntu images can change their preinstalled package set.
          # Install the required Chromium runtime libraries when needed.
          if dpkg -s libasound2t64 libatk-bridge2.0-0t64 libgbm1 libnss3 libxkbcommon0 >/dev/null 2>&1; then
            echo "Playwright runtime libraries already installed; skipping apt-get"
            exit 0
          fi
          if [ "$(id -u)" = "0" ]; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              libasound2t64 \
              libatk-bridge2.0-0t64 \
              libatk1.0-0t64 \
              libatspi2.0-0t64 \
              libcairo2 \
              libcups2t64 \
              libdbus-1-3 \
              libdrm2 \
              libgbm1 \
              libglib2.0-0t64 \
              libnspr4 \
              libnss3 \
              libpango-1.0-0 \
              libx11-6 \
              libxcb1 \
              libxcomposite1 \
              libxdamage1 \
              libxext6 \
              libxfixes3 \
              libxkbcommon0 \
              libxrandr2

          else
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              libasound2t64 \
              libatk-bridge2.0-0t64 \
              libatk1.0-0t64 \
              libatspi2.0-0t64 \
              libcairo2 \
              libcups2t64 \
              libdbus-1-3 \
              libdrm2 \
              libgbm1 \
              libglib2.0-0t64 \
              libnspr4 \
              libnss3 \
              libpango-1.0-0 \
              libx11-6 \
              libxcb1 \
              libxcomposite1 \
              libxdamage1 \
              libxext6 \
              libxfixes3 \
              libxkbcommon0 \
              libxrandr2
          fi
      - name: Install Playwright browser
        run: pnpm exec playwright install chromium
      - name: Verify Playwright browser launch
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const { chromium } = require("playwright");

          (async () => {
            const executable = chromium.executablePath();
            if (!fs.existsSync(executable)) {
              throw new Error(`Missing cached Playwright browser: ${executable}`);
            }
            const browser = await chromium.launch({ headless: true });
            await browser.close();
            console.log(`Verified cached Playwright browser launch: ${executable}`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - run: pnpm test:browser

  browser-extension:
    name: Browser extension tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes
    if: ${{ needs.changes.outputs.browser_extension == 'true' }}
    defaults:
      run:
        working-directory: apps/browser-extension
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/browser-extension/package-lock.json
      - run: npm ci
      - name: Test and type-check browser extension
        run: |
          npm test
          npm run typecheck

  live-e2e-core:
    name: Live E2E core
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [changes, frontend-assets]
    if: ${{ needs.changes.outputs.rust_test == 'true' || needs.changes.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 9.15.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/gateway-admin/pnpm-lock.yaml
      - run: pnpm --dir apps/gateway-admin install --frozen-lockfile
      - name: Install Playwright browser and runtime libraries
        run: pnpm --dir apps/gateway-admin exec playwright install --with-deps chromium
      - name: Download immutable Gateway Admin assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gateway-admin-out
          path: apps/gateway-admin/out
      - name: Select exclusive live E2E run root
        shell: bash
        run: |
          set -euo pipefail
          run_root="${RUNNER_TEMP}/labby-live-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          test ! -e "$run_root"
          printf 'LABBY_E2E_RUN_ROOT=%s\n' "$run_root" >> "$GITHUB_ENV"
      - name: Run bounded hermetic product E2E shards
        env:
          CARGO_BUILD_JOBS: "2"
          LABBY_E2E_SEED: "1"
          LABBY_E2E_TIER: ${{ github.event_name == 'schedule' && 'nightly' || github.event_name == 'workflow_dispatch' && 'manual' || 'pr' }}
        run: scripts/ci/labby-live-e2e.sh "$LABBY_E2E_TIER" "$LABBY_E2E_SEED"
      - name: Upload concise live E2E evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: labby-live-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/labby-live-e2e-${{ github.run_id }}-${{ github.run_attempt }}-live-e2e-core/artifacts/
          if-no-files-found: error
          retention-days: 3

  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: ${{ needs.changes.outputs.rust_compile == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      # Fails when Cargo.toml, package.json, server.json and friends disagree
      # on the version. Previously reachable only by hand, which is how a
      # sibling repo sat seven releases out of sync unnoticed.
      - name: Check version sync
        run: bash scripts/check-version-sync.sh
      - name: Check Rust toolchain sync
        run: bash scripts/check-rust-toolchain-sync.sh
      # cargo fmt never invokes rustc, so skip the full setup-rust-kache
      # composite (apt preflight + cache wiring) and install only rustfmt.
      # The fleet may expose read-only runner-global Rust homes, so retain the
      # composite's per-job writable-home guard before invoking rustup.
      - name: Select writable Rust homes for rustfmt
        run: |
          set -euo pipefail
          rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          if ! mkdir -p "$rustup_home" 2>/dev/null || [ ! -w "$rustup_home" ]; then
            rustup_home="$RUNNER_TEMP/rustup"
            mkdir -p "$rustup_home"
          fi
          if ! mkdir -p "$cargo_home" 2>/dev/null || [ ! -w "$cargo_home" ]; then
            cargo_home="$RUNNER_TEMP/cargo"
            mkdir -p "$cargo_home"
          fi
          {
            echo "RUSTUP_HOME=$rustup_home"
            echo "CARGO_HOME=$cargo_home"
          } >> "$GITHUB_ENV"
          echo "$cargo_home/bin" >> "$GITHUB_PATH"
      - name: Install Rust toolchain with rustfmt
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.97.1"
          components: rustfmt
      - run: cargo fmt --all -- --check

  deny:
    name: Cargo Deny
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: changes
    if: ${{ needs.changes.outputs.security == 'true' }}
    env:
      CARGO_DENY_VERSION: "0.19.8"
      CARGO_DENY_SHA256: "70e769ae3872e34d45132b17040859175e11401dc12dddb0303e0b8c7d088f3f"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
      - name: Run pinned Cargo Deny
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d)"
          trap 'rm -rf "$tool_dir"' EXIT
          archive="$tool_dir/cargo-deny.tar.gz"
          curl --fail --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 300 \
            --retry 5 --retry-all-errors --retry-delay 2 \
            --output "$archive" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          printf '%s  %s\n' "$CARGO_DENY_SHA256" "$archive" \
            | sha256sum --check --strict
          tar -xzf "$archive" -C "$tool_dir" --strip-components=1
          "$tool_dir/cargo-deny" --version
          "$tool_dir/cargo-deny" \
            --log-level warn \
            --manifest-path ./Cargo.toml \
            --all-features \
            check

  javascript-advisories:
    name: JavaScript dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: ${{ needs.changes.outputs.javascript_advisories == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 9.15.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Audit every committed JavaScript dependency graph
        run: python scripts/ci/js_advisory_gate.py

  # The former `check` job (cargo check --workspace --all-features --locked)
  # was strictly subsumed by `msrv`: the toolchain pin (1.97.1) IS the MSRV,
  # and msrv additionally checks --all-targets.
  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: changes
    if: ${{ needs.changes.outputs.rust_compile == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      # Compile-only job: include_dir!("../../apps/gateway-admin/out") only
      # needs the directory to exist, so stub it instead of waiting on the
      # full pnpm+next frontend-assets build.
      - name: Stub gateway-admin export for compile-only check
        run: mkdir -p apps/gateway-admin/out && touch apps/gateway-admin/out/index.html
      - name: Install minimum supported Rust
        uses: ./.github/actions/setup-rust-kache
        with:
          toolchain: "1.97.1"
      - name: Warm gateway MSRV test target
        # The workspace all-target pass can otherwise compile the large
        # labby-gateway lib-test target alongside Labby's targets and cross
        # the shared runner memory ceiling. Keep the required command below
        # unchanged; this pass only makes its largest test target reusable.
        run: >-
          cargo +1.97.1 check -p labby-gateway --all-features
          --all-targets --locked
      - run: cargo +1.97.1 check --workspace --all-features --all-targets --locked

  codemode-runner-smoke:
    name: Code Mode runner smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [changes, frontend-assets]
    if: ${{ needs.changes.outputs.rust_test == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gateway-admin-out
          path: apps/gateway-admin/out
      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
      - name: Execute sandbox through the CLI-hosted runner
        run: |
          set -euo pipefail
          cargo run -p labby --bin labby --all-features --locked -- --json gateway code exec \
            --code 'async () => ({ ok: true, sum: 1 + 1 })' \
            | grep -q '"sum":2'

  npm-launcher:
    name: npm launcher
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: ${{ needs.changes.outputs.npm == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "lts/*"
      - name: Test npm launcher
        run: |
          set -euo pipefail
          npm test --prefix packages/labby-mcp
          npm run check --prefix packages/labby-mcp
          npm pack --dry-run --json ./packages/labby-mcp

  feature-slices:
    name: Feature slice (${{ matrix.slice }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [changes, frontend-assets]
    if: ${{ needs.changes.outputs.rust_compile == 'true' }}
    # CLAUDE.md's intent is that each standalone product slice compiles on its
    # own (--no-default-features --features <slice>) to catch cross-slice
    # coupling — a shared module referencing a feature-gated one unconditionally.
    # This is a hard gate on COMPILATION (errors), not warning-cleanliness:
    # per-slice dead-code warnings are an inherent, expected consequence of
    # disabling features (a service module is compiled but its registration is
    # gated off), so this job overrides the global `-D warnings`. The
    # all-features `check`/`clippy`/`test` jobs above remain the authoritative
    # warning-clean signal.
    # Retired ACP, Registry, Marketplace, Deploy, Fleet, and Stash product
    # surfaces are deleted from the workspace. The matrix below covers every
    # supported standalone and composed Labby product slice.
    # Every slice compiles. Gateway also runs its suite so omission-side tests
    # execute; fs and skills run focused behavioral regressions for their
    # feature boundaries.
    env:
      # lld only; see the `test` job for why CARGO_BUILD_JOBS must stay unset.
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=lld"
    strategy:
      fail-fast: false
      matrix:
        slice: [gateway, gateway-host, integrated-gateway, fs, skills]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gateway-admin-out
          path: apps/gateway-admin/out
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
      # Warm the large product crate and its native dependencies first, then
      # complete the all-target pass at normal Cargo concurrency. Compiling the
      # normal library and lib-test harness cold in one invocation crossed the
      # Hosted-runner memory ceiling (SIGKILL) after recent code growth. Keeping
      # the same Cargo job count across both phases preserves aws-lc-sys build
      # parallelism and lets the second phase reuse the already-built library.
      - name: Warm slice compile
        run: >-
          cargo check -p labby --no-default-features
          --features ${{ matrix.slice }} --lib --bins --locked
      - name: Complete all-target slice compile
        run: |
          if [[ "${{ matrix.slice }}" == "gateway" ]]; then
            # Labby's gateway test targets use the dependency's explicitly
            # feature-gated testkit. Keep the product-only warm compile above,
            # then enable test support only while compiling test targets.
            cargo check -p labby --no-default-features \
              --features gateway,proxy-testkit --all-targets --locked
          else
            cargo check -p labby --no-default-features \
              --features ${{ matrix.slice }} --all-targets --locked
          fi
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        if: matrix.slice == 'gateway'
        with:
          install_args: cargo:cargo-nextest
      - name: Run gateway-slice test suite
        if: matrix.slice == 'gateway'
        run: >-
          cargo nextest run -p labby --no-default-features
          --features gateway,proxy-testkit --locked
      - name: Run fs-slice proxy preflight regression
        if: matrix.slice == 'fs'
        run: cargo test -p labby --no-default-features --features fs --locked --test doctor_proxy_preflight
      - name: Run standalone skills-slice regressions
        if: matrix.slice == 'skills'
        run: >-
          cargo test -p labby --no-default-features --features skills --locked
          skills::

  extracted-crate-slices:
    name: Extracted crate slices
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: changes
    if: ${{ needs.changes.outputs.rust_compile == 'true' }}
    env:
      RUSTFLAGS: ""
    # Check the nine independent slices sequentially to keep this job within
    # the hosted runner resource budget.
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
      - name: labby-auth-minimal
        run: cargo check -p labby-auth --no-default-features --all-targets --locked
      - name: labby-auth-http-axum
        run: cargo check -p labby-auth --no-default-features --features http-axum --all-targets --locked
      - name: labby-auth-upstream-oauth-rmcp
        run: cargo check -p labby-auth --no-default-features --features upstream-oauth-rmcp --all-targets --locked
      - name: labby-auth-all-runtime-features
        run: cargo check -p labby-auth --no-default-features --features http-axum,upstream-oauth-rmcp --all-targets --locked
      - name: labby-codemode
        run: cargo check -p labby-codemode --all-targets --locked
      - name: labby-gateway
        run: cargo check -p labby-gateway --all-targets --locked
      - name: labby-runtime
        run: cargo check -p labby-runtime --no-default-features --all-targets --locked
      - name: labby-web
        run: cargo check -p labby-web --all-targets --locked
      - name: labby-winjob
        run: cargo check -p labby-winjob --all-targets --locked

  docs-check:
    name: Generated docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [changes, frontend-assets]
    if: ${{ needs.changes.outputs.docs_check == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gateway-admin-out
          path: apps/gateway-admin/out
      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          install_args: just
      - run: just docs-check

  rustdoc:
    name: Rustdoc
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: changes
    if: ${{ needs.changes.outputs.rust_compile == 'true' || needs.changes.outputs.workflow == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          install_args: just
      - name: Build and verify Rustdoc
        run: just rustdoc-check
      - name: Upload Rustdoc HTML
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustdoc-html
          path: |
            target/doc
            target/rustdoc-extra/doc
          if-no-files-found: error

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: changes
    if: ${{ needs.changes.outputs.rust_compile == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      # Compile-only job: stub the embedded frontend export instead of
      # waiting on the full frontend-assets build (see msrv).
      - name: Stub gateway-admin export for compile-only check
        run: mkdir -p apps/gateway-admin/out && touch apps/gateway-admin/out/index.html
      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
        with:
          components: clippy
      # Keep all-target coverage while avoiding cold normal-library and
      # lib-test harnesses competing for the runner memory ceiling. Warm the
      # ordinary `labby` targets first; that also warms normal `labby-gateway`
      # dependencies. The following all-target passes can then compile test,
      # example, and bench harnesses without a second large normal target in
      # flight, while Cargo/native build concurrency remains unchanged.
      - name: Warm Labby Clippy targets
        run: cargo clippy -p labby --all-features --lib --bins --locked -- -D warnings
      - name: Lint extracted workspace targets
        run: >-
          cargo clippy --workspace --exclude labby --all-features
          --all-targets --locked -- -D warnings
      - name: Warm Labby Clippy test dependency graph
        # Selecting one integration test enables the same dev-dependency
        # feature graph as the all-target pass while keeping that large normal
        # library compile isolated from the remaining test targets.
        run: >-
          cargo clippy -p labby --all-features
          --test architecture_boundaries --locked -- -D warnings
      - name: Lint all Labby targets
        run: >-
          cargo clippy -p labby --all-features --all-targets --locked
          -- -D warnings

  mcp-regressions:
    name: MCP focused regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=lld"
    needs: [changes, frontend-assets]
    if: ${{ needs.changes.outputs.rust_test == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gateway-admin-out
          path: apps/gateway-admin/out
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
      - name: Warm MCP regression targets
        run: cargo build -p labby --all-features --lib --bins --locked
      - name: MCP route-scope resources/tools and list pagination
        run: |
          cargo test -p labby --all-features --locked mcp::handlers_resources::tests
          cargo test -p labby --all-features --locked mcp::handlers_tools::tests
      - name: Upstream ui resource route scope
        run: |
          cargo test -p labby-gateway --features testkit --locked read_upstream_ui_resource
          cargo test -p labby-gateway --lib --features testkit --locked healthy_tool_names_allowed_matches_route_and_exposure_filters
      - name: Elicitation and relay controls
        run: |
          cargo test -p labby --all-features --locked destructive_builtin_uses_stateless_mrtr_elicitation
          cargo test -p labby-gateway --lib --locked upstream_input_required_is_preserved_for_downstream
          cargo test -p labby-gateway --lib --locked stateless_adapter_ignores_legacy_session_ids_in_both_directions
      - name: Lifecycle, SEP-2243 headers, caching, and subscriptions
        run: |
          cargo test -p labby --all-features --locked cli::serve::tests::http_mcp_
          cargo test -p labby --all-features --locked stateless_subscription_receives_catalog_notifications
      - name: Accepted SEP-2640 server, client, and intermediary behavior
        run: |
          cargo test -p labby-runtime --all-features --locked --test skills_contract_conformance
          cargo test -p labby-runtime --all-features --locked --test sep_2640_uri_conformance
          cargo test -p labby-gateway --all-features --locked skills
          cargo test -p labby --all-features --locked mcp::skills

  mcp-conformance:
    name: MCP 2026-07-28 conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: changes
    env:
      # Overrides the workflow-level `RUSTFLAGS: -D warnings`, which the
      # vendored `mcp-conformance` SDK checkout cannot build under. The script
      # used to clear RUSTFLAGS entirely, which also discarded the fleet's lld
      # linker AND gave every build here a fingerprint no other job shares —
      # so this job always compiled `labby` from scratch. Matching `test`'s
      # value byte-for-byte lets kache reuse its artifacts.
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=lld"
    if: >-
      ${{
        needs.changes.outputs.rust_test == 'true' ||
        needs.changes.outputs.workflow == 'true'
      }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          install_args: cargo:cargo-nextest
      - name: Verify Labby auth core and extension contracts
        run: cargo test -p labby-auth --all-features --locked
      - name: Verify authoritative auth requirement matrix
        run: python3 -m unittest scripts.ci.test_auth_spec_matrix
      - name: Verify frozen MCP source digests and extraction reproducibility
        run: python3 scripts/ci/refresh_mcp_auth_denominator.py --check
      - name: Verify current OpenAI authentication source denominator
        run: python3 scripts/ci/refresh_openai_auth_denominator.py --check
      - name: Verify requirement-specific OpenAI authentication contracts
        run: scripts/ci/openai-auth-conformance.sh
      - name: Verify requirement-specific MCP authorization contracts
        run: python3 scripts/ci/mcp_auth_normative_conformance.py
      - name: Run dated protocol and extension suites
        run: |
          python3 -m unittest scripts/ci/test_mcp_conformance_script.py
          scripts/ci/mcp-conformance.sh
      - name: Upload conformance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mcp-conformance
          path: target/mcp-conformance
          if-no-files-found: warn

  test:
    name: Test
    # Hosted runners connect Kache to the shared MinIO cache when credentials
    # are available. The action keeps a GitHub Actions cache fallback.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # lld keeps the link step cheap. Do NOT reintroduce CARGO_BUILD_JOBS
      # here: Cargo also passes it to every build script as NUM_JOBS, and
      # aws-lc-sys compiles 414 C and 902 assembly sources through the cc
      # crate. kache cannot cache any of that -- it wraps rustc, not cc -- so
      # a job-wide throttle serializes ~1300 uncached native sources. The
      # current memory failure is different: a cold normal library and its
      # lib-test harness can overlap with other Rust targets and cross the
      # runner ceiling. Warm normal Labby/Gateway targets below, then bound
      # only nextest's remaining Rust compilation without throttling the
      # native warm-up builds.
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=lld"
    if: >-
      needs.changes.outputs.rust_test == 'true' &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    needs: [changes, frontend-assets]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gateway-admin-out
          path: apps/gateway-admin/out
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          install_args: cargo:cargo-nextest
      - name: Warm normal Linux test targets
        run: cargo build -p labby --all-features --lib --bins --locked
      - name: Warm gateway lib-test harness
        # Keep this large harness from linking concurrently with Labby's test
        # targets during nextest discovery; that overlap exceeds the runner's
        # memory ceiling even though either harness fits on its own.
        run: cargo test -p labby-gateway --all-features --lib --no-run --locked
      - name: Qualify production-shaped access migration and rollback
        run: |
          cargo test -p labby --all-features --locked \
            access::migrations::tests::production_shaped_v5_checkpoint_restores_exact_logical_inventory
          cargo test -p labby --all-features --locked \
            access::migrations::tests::migration_evidence_binds_checkpoint_and_replay_operation
      - name: Run workspace tests
        # Default concurrency can link the labby and labby-gateway harnesses
        # together and exceed the runner's memory ceiling. One job is too
        # slow for the JIT runner lifetime, so retain bounded parallelism.
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo nextest run --workspace --all-features --locked --profile ci
      - name: Upload nextest report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nextest-junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 14

  test-fork:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Match the internal-PR test job resource profile.
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=lld"
    needs: [changes, frontend-assets]
    if: >-
      needs.changes.outputs.rust_test == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gateway-admin-out
          path: apps/gateway-admin/out
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          install_args: cargo:cargo-nextest
      - name: Warm normal Linux test targets
        run: cargo build -p labby --all-features --lib --bins --locked
      - run: cargo nextest run --workspace --all-features --locked --profile ci
      - name: Upload nextest report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nextest-junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 14

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    needs: [changes, frontend-assets]
    # Windows filesystem and process-containment behavior is platform-specific;
    # Rust changes must prove it natively before the shared gate can pass.
    if: ${{ needs.changes.outputs.rust_test == 'true' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gateway-admin-out
          path: apps/gateway-admin/out
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.97.1"
      - name: Neutralize rustc wrapper (native Windows)
        shell: pwsh
        run: |
          "RUSTC_WRAPPER=" >> $env:GITHUB_ENV
          "CARGO_BUILD_RUSTC_WRAPPER=" >> $env:GITHUB_ENV
      - name: Restore Windows Cargo cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: . -> target
          key: workspace-native-windows-v2
          cache-on-failure: true
      - name: Prepare hosted Windows build cache
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $targetDir = $env:CARGO_TARGET_DIR
          $targetMaxBytes = 12GB

          function Get-TreeSizeBytes($Path) {
            if (-not (Test-Path $Path)) {
              return 0
            }
            $sum = Get-ChildItem -LiteralPath $Path -Recurse -Force -File -ErrorAction SilentlyContinue |
              Measure-Object -Property Length -Sum
            if ($null -eq $sum.Sum) {
              return 0
            }
            return [int64]$sum.Sum
          }

          function Remove-IfExists($Path) {
            if (Test-Path $Path) {
              Remove-Item -LiteralPath $Path -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          function Enforce-HardCap($Path, $MaxBytes, $Label) {
            $size = Get-TreeSizeBytes $Path
            if ($size -gt $MaxBytes) {
              Write-Warning "$Label is $([math]::Round($size / 1GB, 2)) GiB, above $([math]::Round($MaxBytes / 1GB, 2)) GiB; wiping it to enforce the hard cap."
              Remove-Item -LiteralPath $Path -Recurse -Force -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Force -Path $Path | Out-Null
              $size = Get-TreeSizeBytes $Path
            }
            Write-Host "$Label ready at $Path ($([math]::Round($size / 1GB, 2)) GiB, hard cap $([math]::Round($MaxBytes / 1GB, 2)) GiB)."
          }

          function Remove-TargetBuildDirs($TargetDir, $Patterns) {
            $buildDir = Join-Path $TargetDir "debug\build"
            if (-not (Test-Path $buildDir)) {
              return
            }
            foreach ($pattern in $Patterns) {
              Get-ChildItem -LiteralPath $buildDir -Directory -Filter $pattern -ErrorAction SilentlyContinue |
                Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null

          # Native bindgen outputs can be left half-written by interrupted runs,
          # and Cargo may then reuse the stale build dir until the include! fails.
          Remove-TargetBuildDirs $targetDir @("libsqlite3-sys-*")

          $size = Get-TreeSizeBytes $targetDir
          if ($size -gt $targetMaxBytes) {
            Write-Warning "Hosted Cargo target dir is $([math]::Round($size / 1GB, 2)) GiB, above $([math]::Round($targetMaxBytes / 1GB, 2)) GiB; pruning volatile caches."
            Remove-IfExists (Join-Path $targetDir "debug\incremental")
            Remove-IfExists (Join-Path $targetDir "debug\.fingerprint")
            Remove-IfExists (Join-Path $targetDir "debug\deps")
          }

          Enforce-HardCap $targetDir $targetMaxBytes "Hosted Cargo target dir"
      - name: Install cargo-nextest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "0.9.138"
          $current = $null
          try {
            $current = (& cargo nextest --version 2>$null)
          } catch {
            $current = $null
          }
          if ($current -like "*$version*") {
            Write-Host "cargo-nextest already installed: $current"
            exit 0
          }

          $target = "x86_64-pc-windows-msvc"
          $base = "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$version"
          $archive = Join-Path $env:RUNNER_TEMP "cargo-nextest.tar.gz"
          $shaFile = Join-Path $env:RUNNER_TEMP "cargo-nextest.sha256"
          $extractDir = Join-Path $env:RUNNER_TEMP "cargo-nextest"
          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"

          Invoke-WebRequest "$base/cargo-nextest-$version-$target.tar.gz" -OutFile $archive -TimeoutSec 300
          Invoke-WebRequest "$base/cargo-nextest-$version-$target.sha256" -OutFile $shaFile -TimeoutSec 300

          $expected = (Get-Content $shaFile -Raw).Split(" ")[0].Trim().ToLowerInvariant()
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "cargo-nextest checksum mismatch: expected $expected, got $actual"
          }

          if (Test-Path $extractDir) {
            Remove-Item -Recurse -Force $extractDir
          }
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          tar -xzf $archive -C $extractDir
          $exe = Get-ChildItem -Path $extractDir -Recurse -Filter cargo-nextest.exe | Select-Object -First 1
          if (-not $exe) {
            throw "cargo-nextest.exe not found in release archive"
          }

          New-Item -ItemType Directory -Force -Path $cargoBin | Out-Null
          Copy-Item $exe.FullName (Join-Path $cargoBin "cargo-nextest.exe") -Force
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $cargoBin "cargo-nextest.exe") --version
      - name: Check Windows Job Object helper crate
        shell: pwsh
        run: cargo check -p labby-winjob --all-targets --locked
      - name: Compile every Windows workspace target
        shell: pwsh
        run: cargo test --workspace --all-features --locked --no-run
      - name: Run native Windows workspace tests (shard ${{ matrix.shard }}/4)
        shell: pwsh
        run: cargo nextest run --workspace --all-features --locked --profile ci --test-threads 4 --partition hash:${{ matrix.shard }}/4
      - name: Run Windows Job Object reaping integration test
        if: matrix.shard == 1
        shell: pwsh
        run: cargo nextest run -p labby --test windows_job_object_reaping --all-features --locked --profile ci --run-ignored ignored-only
      - name: Enforce Windows build cache caps
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $targetDir = $env:CARGO_TARGET_DIR
          $targetMaxBytes = 12GB

          function Get-TreeSizeBytes($Path) {
            if (-not (Test-Path $Path)) {
              return 0
            }
            $sum = Get-ChildItem -LiteralPath $Path -Recurse -Force -File -ErrorAction SilentlyContinue |
              Measure-Object -Property Length -Sum
            if ($null -eq $sum.Sum) {
              return 0
            }
            return [int64]$sum.Sum
          }

          function Enforce-HardCap($Path, $MaxBytes, $Label) {
            New-Item -ItemType Directory -Force -Path $Path | Out-Null
            $size = Get-TreeSizeBytes $Path
            if ($size -gt $MaxBytes) {
              Write-Warning "$Label grew to $([math]::Round($size / 1GB, 2)) GiB, above $([math]::Round($MaxBytes / 1GB, 2)) GiB; wiping it to enforce the hard cap."
              Remove-Item -LiteralPath $Path -Recurse -Force -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Force -Path $Path | Out-Null
              $size = Get-TreeSizeBytes $Path
            }
            Write-Host "$Label final size: $([math]::Round($size / 1GB, 2)) GiB (hard cap $([math]::Round($MaxBytes / 1GB, 2)) GiB)."
          }

          Enforce-HardCap $targetDir $targetMaxBytes "Persistent Cargo target dir"

  release-contract:
    name: Release metadata contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes
    if: ${{ needs.changes.outputs.release == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Validate release metadata
        run: |
          bash scripts/check-version-sync.sh
          bash scripts/check-rust-toolchain-sync.sh

  container-contract:
    name: Container source contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Validate container source inputs
        run: |
          set -euo pipefail
          test -f config/Dockerfile
          test -f .dockerignore
          test -f apps/gateway-admin/package.json
          # These are literal Dockerfile contracts.
          # shellcheck disable=SC2016
          grep -Fq 'FROM ${LABBY_BUILDER_IMAGE}' config/Dockerfile
          # shellcheck disable=SC2016
          grep -Fq 'FROM ${LABBY_RUNTIME_IMAGE}' config/Dockerfile
          set -a
          source config/container-supply.conf
          set +a
          scripts/ci/validate-supply-manifest.py
          LABBY_IMAGE="ghcr.io/dinglebear-ai/labby@sha256:$(printf 'a%.0s' {1..64})" scripts/ci/validate-container-inputs.sh
          python3 scripts/ci/test-container-topology.py
          grep -Fq 'COPY apps/gateway-admin/out' config/Dockerfile
          grep -Fq 'ARG LABBY_NPM_VERSION' config/Dockerfile
          grep -Fq 'ARG LABBY_NPM_SHA512' config/Dockerfile
          grep -Fq 'registry.npmjs.org/npm/-/npm-' config/Dockerfile
          grep -Fq 'tar/package.json' config/Dockerfile
          grep -Fq 'undici/package.json' config/Dockerfile
          grep -Fq '7.5.19' config/Dockerfile
          grep -Fq '6.27.0' config/Dockerfile
          grep -Fq 'crates/labby/tests/fixtures/stdio_mcp_fixture.rs' config/Dockerfile
          grep -Fq 'node node_modules/@anthropic-ai/claude-code/install.cjs' config/Dockerfile
          grep -Fq 'HEALTHCHECK' config/Dockerfile

  palette-web:
    name: Palette renderer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: changes
    if: ${{ needs.changes.outputs.palette == 'true' }}
    defaults:
      run:
        working-directory: apps/palette-tauri
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 9.15.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/palette-tauri/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm coverage
      - run: pnpm typecheck
      - run: pnpm vite:build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: palette-renderer-coverage
          path: apps/palette-tauri/coverage/
          if-no-files-found: error

  palette-rust:
    name: Palette Tauri (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: changes
    if: ${{ needs.changes.outputs.palette == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
      - name: Install Tauri system dependencies
        # Self-contained on purpose. `setup-rust-kache` used to supply
        # libgtk-3-dev and libxdo-dev to every Rust job as a side effect; it no
        # longer installs desktop packages, so the one job that actually needs
        # them names them here. Tauri v2 requires webkit2gtk 4.1 specifically —
        # if this step ever fails to find it, the runner image is too old for a
        # Tauri build and failing here is the correct outcome.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - run: cargo test --manifest-path apps/palette-tauri/src-tauri/Cargo.toml --locked
      - uses: taiki-e/install-action@3ae2e1de8b1f6447853fd29a6000b3953b0494ac
        with:
          tool: cargo-deny@0.20.2
      - name: Audit Palette dependencies
        run: |
          "$CARGO_HOME/bin/cargo-deny" --version
          "$CARGO_HOME/bin/cargo-deny" \
            --manifest-path apps/palette-tauri/src-tauri/Cargo.toml \
            --config apps/palette-tauri/src-tauri/deny.toml \
            check advisories

  palette-windows:
    name: Palette Tauri (Windows advisory)
    runs-on: windows-latest
    needs: changes
    # Advisory, excluded from ci-gate; main pushes and scheduled/manual runs
    # only. Native Rust test-windows is separately required on pull requests.
    if: ${{ github.event_name != 'pull_request' && needs.changes.outputs.palette == 'true' }}
    timeout-minutes: 60
    # GitHub-hosted job: do not inherit an ambient compiler wrapper. Cache jobs
    # configure kache explicitly through setup-rust-kache.
    env:
      RUSTC_WRAPPER: ""
      CARGO_BUILD_RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: apps/palette-tauri/src-tauri
          key: palette-tauri-windows-v1
          cache-on-failure: true
      - run: cargo test --manifest-path apps/palette-tauri/src-tauri/Cargo.toml --locked
      - run: cargo build --manifest-path apps/palette-tauri/src-tauri/Cargo.toml --locked

  rust-coverage:
    name: Rust coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=lld"
    needs: [changes, frontend-assets]
    # Coverage is a required regression gate for Rust changes, including PRs.
    if: ${{ needs.changes.outputs.rust_test == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gateway-admin-out
          path: apps/gateway-admin/out
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@3ae2e1de8b1f6447853fd29a6000b3953b0494ac
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Collect coverage
        run: cargo llvm-cov nextest --workspace --all-features --locked --profile ci --lcov --output-path lcov.info
      - name: Enforce coverage floor and critical-module floor
        run: |
          python3 scripts/ci/check-rust-coverage.py lcov.info \
            --overall-minimum 15 \
            --critical-minimum 30 \
            --critical crates/labby-auth/src/ \
            --critical crates/labby-gateway/src/ \
            --critical crates/labby/src/dispatch/ \
            --critical crates/labby/src/config.rs \
            --summary coverage-summary.md
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-coverage
          path: |
            lcov.info
            coverage-summary.md
          if-no-files-found: error

  authelia-acceptance:
    name: Pinned Authelia acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: ${{ needs.changes.outputs.rust_test == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
      - name: Run isolated real-Authelia flow
        run: bash tests/authelia/run.sh

  ci-gate:
    name: ci-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: always()
    needs:
      - fleet-policy
      - changes
      - unraid-plugin-check
      - actionlint
      - lifecycle-static-analysis
      - windows-installer
      - macos-installer
      - frontend-assets
      - gateway-admin-browser
      - browser-extension
      - live-e2e-core
      - fmt
      - deny
      - javascript-advisories
      - msrv
      - npm-launcher
      - feature-slices
      - extracted-crate-slices
      - docs-check
      - rustdoc
      - clippy
      - test
      - test-windows
      - test-fork
      - codemode-runner-smoke
      - mcp-regressions
      - mcp-conformance
      - release-contract
      - container-contract
      - palette-web
      - palette-rust
      - rust-coverage
      - authelia-acceptance
    steps:
      - name: report changed-path routing drift
        if: ${{ needs.changes.outputs.gate_key_drift != '' }}
        env:
          GATE_KEY_DRIFT: ${{ needs.changes.outputs.gate_key_drift }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Outside a pull request the classifier comes from this same commit,
          # so drift means ci.yml and changed_paths.py genuinely disagree. That
          # is a defect on main, not the transitional base-branch window.
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "::error::changed-path routing drift outside a pull request: ${GATE_KEY_DRIFT}. ci.yml gates on keys scripts/ci/changed_paths.py does not emit."
            exit 1
          fi
          echo "::warning title=Changed-path routing drift::the trusted base-branch classifier does not emit: ${GATE_KEY_DRIFT}. Jobs gated on those keys ran fail-open. The drift clears once the base branch carries a scripts/ci/changed_paths.py that emits them."
          printf 'Changed-path routing drift (ran fail-open): %s\n' "$GATE_KEY_DRIFT" >> "$GITHUB_STEP_SUMMARY"
      - name: verify required jobs passed or were intentionally skipped
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          require_success_or_skipped() {
            local name="$1"
            local result="$2"
            case "$result" in
              success|skipped) printf '%s=%s\n' "$name" "$result" ;;
              *) echo "::error::$name concluded $result" >&2; exit 1 ;;
            esac
          }
          # `changes` owns every routing decision: if it does not run, every
          # gate expression is empty, every gated job skips, and the whole run
          # is vacuously green. It must succeed on trusted branches; the only
          # exception is the fork-safety case handled explicitly below.
          require_success() {
            local name="$1"
            local result="$2"
            if [[ "$name" == changes && "$result" == skipped \
              && "$EVENT_NAME" == pull_request \
              && "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
              # Fork PRs intentionally skip changes before any fork-controlled
              # script can run. Their trusted policy, contract, and protected
              # documentation checks still run independently.
              printf '%s=%s (fork safety)\n' "$name" "$result"
              return
            fi
            case "$result" in
              success) printf '%s=%s\n' "$name" "$result" ;;
              *) echo "::error::$name concluded $result; it must run for path routing to be meaningful" >&2; exit 1 ;;
            esac
          }
          require_success fleet-policy "${{ needs.fleet-policy.result }}"
          require_success changes "${{ needs.changes.result }}"
          require_success_or_skipped unraid-plugin-check "${{ needs.unraid-plugin-check.result }}"
          require_success_or_skipped actionlint "${{ needs.actionlint.result }}"
          require_success_or_skipped lifecycle-static-analysis "${{ needs.lifecycle-static-analysis.result }}"
          require_success_or_skipped windows-installer "${{ needs.windows-installer.result }}"
          require_success_or_skipped macos-installer "${{ needs.macos-installer.result }}"
          require_success_or_skipped frontend-assets "${{ needs.frontend-assets.result }}"
          require_success_or_skipped gateway-admin-browser "${{ needs.gateway-admin-browser.result }}"
          require_success_or_skipped browser-extension "${{ needs.browser-extension.result }}"
          require_success_or_skipped live-e2e-core "${{ needs.live-e2e-core.result }}"
          require_success_or_skipped fmt "${{ needs.fmt.result }}"
          require_success_or_skipped deny "${{ needs.deny.result }}"
          require_success_or_skipped javascript-advisories "${{ needs.javascript-advisories.result }}"
          require_success_or_skipped msrv "${{ needs.msrv.result }}"
          require_success_or_skipped npm-launcher "${{ needs.npm-launcher.result }}"
          require_success_or_skipped feature-slices "${{ needs.feature-slices.result }}"
          require_success_or_skipped extracted-crate-slices "${{ needs.extracted-crate-slices.result }}"
          require_success_or_skipped docs-check "${{ needs.docs-check.result }}"
          require_success_or_skipped rustdoc "${{ needs.rustdoc.result }}"
          require_success_or_skipped clippy "${{ needs.clippy.result }}"
          require_success_or_skipped test "${{ needs.test.result }}"
          require_success_or_skipped test-windows "${{ needs.test-windows.result }}"
          require_success_or_skipped test-fork "${{ needs.test-fork.result }}"
          require_success_or_skipped codemode-runner-smoke "${{ needs.codemode-runner-smoke.result }}"
          require_success_or_skipped mcp-regressions "${{ needs.mcp-regressions.result }}"
          require_success_or_skipped mcp-conformance "${{ needs.mcp-conformance.result }}"
          require_success_or_skipped release-contract "${{ needs.release-contract.result }}"
          require_success_or_skipped container-contract "${{ needs.container-contract.result }}"
          require_success_or_skipped palette-web "${{ needs.palette-web.result }}"
          require_success_or_skipped palette-rust "${{ needs.palette-rust.result }}"
          require_success_or_skipped rust-coverage "${{ needs.rust-coverage.result }}"
          require_success_or_skipped authelia-acceptance "${{ needs.authelia-acceptance.result }}"
